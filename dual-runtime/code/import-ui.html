<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="import-token" content="__CSRF_TOKEN__"><title>导入账号</title>
<style>body{font:15px/1.55 system-ui,sans-serif;margin:0;background:#f4f5f7;color:#1d1f23}.box{max-width:760px;margin:40px auto;padding:28px;background:#fff;border-radius:12px;box-shadow:0 5px 20px #0001}h1{margin-top:0}label{display:block;margin:18px 0 7px;font-weight:600}input,textarea,select,button{box-sizing:border-box;font:inherit}input,textarea,select{width:100%;padding:10px;border:1px solid #c8ccd2;border-radius:7px}textarea{min-height:280px;resize:vertical}button{padding:10px 16px;border:0;border-radius:7px;background:#2563eb;color:#fff;cursor:pointer;font-weight:600}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:10px;margin-top:16px}.muted{color:#5f6874}.result{white-space:pre-wrap;margin-top:16px;padding:12px;border-radius:7px;background:#f4f5f7}.error{background:#fff0f0;color:#a40000}@media(prefers-color-scheme:dark){body{background:#111316;color:#e7e9ec}.box{background:#1b1e23}.result{background:#272b31}input,textarea,select{background:#252a30;color:inherit;border-color:#4a525d}}</style></head>
<body><main class="box"><h1>导入账号 JSON</h1><p class="muted">上传浏览器导出的 Google Cookie JSON。导入后返回管理首页。</p><label for="file">选择 JSON 文件</label><input id="file" type="file" accept="application/json,.json"><label for="raw">或粘贴 JSON</label><textarea id="raw" spellcheck="false" placeholder='{"cookies":[...]}'></textarea><label for="tier">账号等级</label><select id="tier"><option value="normal">普通</option><option value="pro">Pro</option><option value="ultra">Ultra 5x</option><option value="ultra20">Ultra 20x</option></select><label for="alias">账号名称（可选）</label><input id="alias" maxlength="80"><div class="actions"><button id="import">导入 JSON</button><button id="back" type="button">返回首页</button></div><div id="result" class="result" hidden></div></main>
<script>
const $=id=>document.getElementById(id),token=document.querySelector('meta[name="import-token"]').content;
function show(message,error=false){const el=$('result');el.hidden=false;el.className='result'+(error?' error':'');el.textContent=message;}
$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{$('raw').value=await file.text();show('已读取文件，点击“导入 JSON”。');}catch{show('无法读取该文件。',true);}};
$('back').onclick=()=>location.href='/';
$('import').onclick=async()=>{const button=$('import');let body;try{body=JSON.parse($('raw').value);}catch{show('JSON 格式无效。',true);return;}button.disabled=true;show('正在导入…');try{const response=await fetch('/api/import-account',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Import-Token':token,'X-Account-Tier':$('tier').value,'X-Account-Alias':encodeURIComponent($('alias').value.trim())},body:JSON.stringify(body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'服务器拒绝导入');show('导入成功：账号 #'+data.index+'。正在返回首页…');setTimeout(()=>location.href='/',900);}catch(error){show('导入失败：'+error.message,true);button.disabled=false;}};
</script></body></html>
