<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · AIS2API</title><link rel="icon" type="image/png" href="/public-assets/nai-favicon.png"><meta name="theme-color" content="#1b1a4a">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:20px;color:#eef0ff;font:14px/1.5 Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
 background:linear-gradient(180deg,rgb(14 14 46/.35),rgb(14 14 46/.75)),url(/public-assets/nai-hero.webp) center 35%/cover no-repeat #12123a}
.panel{width:min(380px,100%);padding:30px 28px 26px;border:1px solid rgb(255 255 255/.18);border-radius:24px;background:rgb(20 20 60/.48);
 backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 30px 60px -20px rgb(0 0 0/.6)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img{width:52px;height:52px;border-radius:16px;border:2px solid rgb(255 255 255/.5);box-shadow:0 8px 24px -6px rgb(120 110 255/.7)}
.brand strong{display:block;font-size:22px;letter-spacing:-.3px;background:linear-gradient(135deg,#c9c4ff,#f1d4ff 55%,#9be7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:#c3c6ef;font-size:12px}
label{display:block;margin-bottom:6px;color:#d6d8ff;font-size:12px;font-weight:600}
input{width:100%;min-height:44px;padding:10px 14px;border:1px solid rgb(255 255 255/.22);border-radius:12px;background:rgb(255 255 255/.10);color:#fff;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#a9acd6}
input:focus{border-color:#a8a2ff;box-shadow:0 0 0 3px rgb(168 162 255/.3)}
button{width:100%;min-height:44px;margin-top:16px;border:0;border-radius:12px;color:#fff;font:inherit;font-weight:700;cursor:pointer;
 background:linear-gradient(135deg,#6a5cf0,#a462f0 55%,#2bb5e8);box-shadow:0 12px 26px -10px rgb(120 100 255/.8);transition:filter .15s}
button:hover{filter:brightness(1.08)}
.error{margin:12px 0 0;padding:8px 12px;border-radius:10px;background:rgb(255 90 120/.18);border:1px solid rgb(255 120 140/.4);color:#ffd6de;font-size:13px}
</style></head><body>
<form class="panel" action="/login" method="post">
<div class="brand"><img src="/public-assets/nai-logo.webp" alt=""><div><strong>AIS2API</strong><small>管理控制台</small></div></div>
<label for="k">密码</label>
<input id="k" type="password" name="apiKey" placeholder="密码（未设置时为 API Key）" autocomplete="current-password" required autofocus>
<!--ERROR-->
<button type="submit">登录</button>
</form></body></html>
